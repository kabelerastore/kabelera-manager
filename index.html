<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabelera Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=10">
<script>
  (function(){
    var t = 'dark';
    try { if (localStorage.getItem('km-theme') === 'light') t = 'light'; } catch(e){}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<a class="skip-link" href="#content">Pular para o conteúdo</a>
<div id="gateScreen" class="gate-screen"></div>
<div id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark"><img src="assets/logo.png" alt="Kabelera"></div>
      <div class="brand">Kabelera<small>Manager</small></div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Fechar menu"></button>
    </div>
    <div style="overflow-y:auto; flex:1;">
      <div class="nav-group" id="navMain"></div>
      <div class="nav-label">Áreas</div>
      <div class="nav-group" id="navAreas"></div>
      <div class="nav-group" id="navFooterLinks"></div>
    </div>
    <div class="sidebar-footer">
      <div class="user-switch"></div>
    </div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <button class="hamburger icon-btn" id="hamburgerBtn" aria-label="Abrir menu"></button>
      <div>
        <h1 class="page-title" id="pageTitle">Visão Geral</h1>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggleBtn" aria-label="Alternar tema" title="Alternar tema claro/escuro"></button>
        <button class="icon-btn" id="refreshBtn" aria-label="Atualizar" title="Atualizar">⟳</button>
        <div style="position:relative;">
          <button class="icon-btn" id="notifBtn" aria-label="Notificações"></button>
          <div id="notifPanel"></div>
        </div>
        <button class="btn btn-primary" id="newTaskBtn"></button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div class="overlay" id="sidebarOverlay"></div>
<div class="overlay" id="drawerOverlay"></div>
<aside class="task-drawer" id="taskDrawer"></aside>
<div class="toast" id="toast"></div>

<script src="lib.js?v=10"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=10"></script>
<script src="supabase-client.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
